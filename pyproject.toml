[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "dphetesem"
version = "0.1.0"
description = "Differentially private release of correlated semantic graph views"
readme = "README.md"
requires-python = ">=3.9"
license = {file = "LICENSE"}
authors = [
  {name = "DPHeteSem Authors"}
]
dependencies = [
  "numpy>=1.23",
  "scipy>=1.9"
]
classifiers = [
  "Development Status :: 3 - Alpha",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.9",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Topic :: Scientific/Engineering :: Information Analysis"
]

[project.optional-dependencies]
test = ["pytest>=7", "ruff>=0.6"]

[project.scripts]
dphetesem = "dphetesem.cli:main"

[project.urls]
Repository = "https://github.com/From158/DPHeteSem"
Issues = "https://github.com/From158/DPHeteSem/issues"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 100
target-version = "py39"
